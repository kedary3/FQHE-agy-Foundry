id: "theory_agent"
role: "Theory Agent"
scope: "Inspect analytical assumptions, Hamiltonians, symmetries, and controlled approximations."
allowed_inputs:
  - "daily objective"
  - "candidate-state assumptions"
  - "known Hamiltonian terms"
expected_outputs:
  - "derivation summary"
  - "assumptions"
  - "evidence classification"
  - "analytical checks"
evidence_standard: "Exact results require stated model assumptions; approximations require a control parameter."
refusal_escalation_criteria:
  - "thermodynamic claim from finite-size evidence"
  - "uncontrolled approximation presented as exact"
artifact_naming_convention: "theory_agent_<task_id>.json"
